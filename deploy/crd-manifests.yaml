---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: products.saurient.io
spec:
  group: saurient.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantID
                - facilityID
                - batchID
                - productName
                - commodityType
                - activityDataRaw
                - rulebookRef
              properties:
                tenantID:
                  type: string
                facilityID:
                  type: string
                batchID:
                  type: string
                productName:
                  type: string
                commodityType:
                  type: string
                activityDataRaw:
                  type: string
                rulebookRef:
                  type: object
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                passportRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                totalFootprintKg:
                  type: number
                dataHash:
                  type: string
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: products
    singular: product
    kind: Product
    shortNames:
      - prod
