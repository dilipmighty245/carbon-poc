apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonpassports.saurient.io
spec:
  group: saurient.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantID
                - facilityID
                - batchID
                - commodityType
                - productRef
                - dataHash
              properties:
                tenantID:
                  type: string
                facilityID:
                  type: string
                batchID:
                  type: string
                commodityType:
                  type: string
                productRef:
                  type: string
                dataHash:
                  type: string
                scope1KgCO2e:
                  type: number
                scope2KgCO2e:
                  type: number
                scope3KgCO2e:
                  type: number
                totalFootprintKg:
                  type: number
                calculationDetails:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                passportID:
                  type: string
                cryptographicHash:
                  type: string
                issuedAt:
                  type: string
                  format: date-time
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: carbonpassports
    singular: carbonpassport
    kind: CarbonPassport
    shortNames:
      - cp
---
