apiVersion: v1
kind: ServiceAccount
metadata:
  name: saurient-controller-sa
  namespace: saurient-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saurient-api-sa
  namespace: saurient-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saurient-controller-role
rules:
  - apiGroups: ["saurient.io"]
    resources: ["carbonpassports", "carbonpassports/status", "calculationrulebooks", "products", "products/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saurient-controller-binding
subjects:
  - kind: ServiceAccount
    name: saurient-controller-sa
    namespace: saurient-system
  - kind: ServiceAccount
    name: saurient-api-sa
    namespace: saurient-system
roleRef:
  kind: ClusterRole
  name: saurient-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saurient-controller
  namespace: saurient-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saurient-controller
  template:
    metadata:
      labels:
        app: saurient-controller
    spec:
      serviceAccountName: saurient-controller-sa
      containers:
        - name: controller
          image: saurient-controller:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_URL
              value: "postgresql://saurient:saurient123@postgres.saurient-system.svc.cluster.local:5432/saurient_db?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis.saurient-system.svc.cluster.local:6379"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saurient-api
  namespace: saurient-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saurient-api
  template:
    metadata:
      labels:
        app: saurient-api
    spec:
      serviceAccountName: saurient-api-sa
      containers:
        - name: api
          image: saurient-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: POSTGRES_URL
              value: "postgresql://saurient:saurient123@postgres.saurient-system.svc.cluster.local:5432/saurient_db?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis.saurient-system.svc.cluster.local:6379"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: saurient-api
  namespace: saurient-system
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: saurient-api
---
apiVersion: saurient.io/v1alpha1
kind: CalculationRulebook
metadata:
  name: cement-rulebook-2026
  namespace: default
spec:
  commodityType: "Cement"
  version: "2026.1"
  scope1Formula: "(fuel_liters * fuel_ef) + (limestone_tons * calcination_ef)"
  scope2Formula: "(electricity_kwh * grid_ef) - (renewable_ppa_kwh * ppa_offset_ef)"
  scope3Formula: "(raw_material_kg * material_ef) + (freight_ton_km * transport_ef)"
  functionalUnit: "kg CO2e per metric ton"
  batchQuantity: 100.0
---
apiVersion: saurient.io/v1alpha1
kind: CalculationRulebook
metadata:
  name: cocoa-rulebook-2026
  namespace: saurient-system
spec:
  commodityType: "Cocoa"
  version: "2026.1"
  scope1Formula: "fuel_consumed_liters * 2.68"
  scope2Formula: "electricity_consumed_kwh * 0.45"
  scope3Formula: "(quantity * 0.175) + (packaging_qty * 1.875) + (distance_km * 0.12)"
  functionalUnit: "kg CO2e per kg"
  batchQuantity: 1000.0
---
